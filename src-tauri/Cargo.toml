[package]
name = "modpack-doctor"
version = "0.1.2"
description = "Diagnoses and fixes Minecraft modpack crashes"
authors = ["KingCreeper531"]
license = "GPL-3.0-only"
repository = "https://github.com/KingCreeper531/modpack-doctor"
edition = "2021"
rust-version = "1.90"

[lib]
name = "modpack_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# Owned by the integrator. Agents propose additions in their report; they do not edit this file.
[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.8.0"
# One app process (CONTRACTS invariant 14): a second launch focuses the running window.
tauri-plugin-single-instance = "2.5.5"
# User-initiated, signed self-updates from GitHub Releases (CONTRACTS invariant 18). Rust-side only.
tauri-plugin-updater = "2.14.1"
# RFC 3339 release dates for `UpdateInfo` (already in the tree through the updater).
time = { version = "0.3", features = ["formatting"] }
# Exact pins REQUIRED: pre-release family with `=` deps between them (docs/research/tauri.md).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
dunce = "1"
dirs = "6"
hex = "0.4"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
rayon = "1.12.0"
notify = "8.2.1"
toml = "1.1.8"
json5 = "1.3.7"
sysinfo = "0.38.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "charset", "http2"] }
encoding_rs = "0.8.44"
# Home-folder scrubbing of logs shared on mclo.gs (same rules as the TS report scrubber).
regex = "1.13.1"
unicode-normalization = "0.1.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }

# `renameat2(RENAME_NOREPLACE)` for no-replace moves (fix engine).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6.5"
# Used by examples/verify_update_sig.rs (release finalize job); already in the tree via the updater plugin.
minisign-verify = "0.3.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
