name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; third-party actions are pinned to full commit SHAs (the comment names the
# release the SHA was resolved from).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede runs on PR updates only; every push to main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Frontend typecheck (app + core-only)
        run: npm run typecheck

      - name: Vitest
        run: npx vitest run

      # Builds dist/ so tauri::generate_context! has a frontend to embed.
      - name: Frontend build
        run: npx vite build

      - name: Rust tests (also regenerates src/bindings.ts)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Bindings are up to date
        shell: bash
        run: git diff --exit-code -- src/bindings.ts

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: App build (no installers)
        run: npx tauri build --no-bundle

  perf:
    name: scan performance (release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npx vite build
      - name: 300-jar scan under 5 s
        working-directory: src-tauri
        run: cargo test --release --lib scan::perf -- --ignored --nocapture
