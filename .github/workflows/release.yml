name: Release

# Builds the installers for a version tag and uploads them, with the updater signatures and
# `latest.json`, to a DRAFT GitHub Release (CONTRACTS.md invariant 18). Nothing reaches users
# until the owner publishes the draft: `releases/latest/download/latest.json` only resolves for a
# published, non-prerelease release.
#
# Release steps: bump the version in src-tauri/tauri.conf.json (+ Cargo.toml, package.json),
# commit, push the tag `v<version>`, wait for this workflow, check the draft, publish it.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY           required: content of %USERPROFILE%/.tauri/modpack-doctor.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  required to exist; empty for this key
#   Optional code signing; each block is skipped while its secrets are unset:
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID (notarization)

on:
  push:
    tags: ["v*"]
  # Run it from a tag ("Use workflow from" → Tags), e.g. to rebuild after a failed job.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run the release workflow from a v* tag, not a branch."
            exit 1
          fi
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json."
            exit 1
          fi

      # One draft for all three build jobs (parallel jobs creating it by tag could race and make
      # duplicates). A re-run reuses the draft that is already there.
      - name: Create or reuse the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == env.TAG and .draft)][0].id // empty')"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Modpack Doctor $TAG" \
              -f body="Installers for Windows (.msi, .exe), macOS (universal .dmg) and Linux (.AppImage, .deb)." \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: draft
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles msi,nsis
            rust_targets: ""
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04: the oldest glibc still on GitHub runners, so the AppImage/.deb run on more distros.
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev libxdo-dev file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}

      - run: npm ci

      # Optional Authenticode signing. Without the secrets the installers are unsigned
      # (SmartScreen warns); updates still work, their minisign signature is separate.
      - name: Windows code signing (optional)
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "No WINDOWS_CERTIFICATE secret: building unsigned Windows installers."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $conf = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.conf.json"
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $conf -Encoding utf8
          "args=--config $conf" >> $env:GITHUB_OUTPUT

      # Optional macOS signing + notarization: only the secrets that are set are exported, since
      # the Tauri CLI treats a set-but-empty APPLE_CERTIFICATE as a certificate to import.
      # Without a certificate the app is signed ad hoc ("-"), which Apple Silicon requires to
      # open it at all; Gatekeeper still asks the user to allow it once.
      - name: macOS code signing (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret: signing the app ad hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 16)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done

      # tauri.release.conf.json turns on `createUpdaterArtifacts`; local builds leave it off so
      # they work without the signing key.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Modpack Doctor ${{ github.ref_name }}
          # The "what's new" text the app shows next to the version (latest.json `notes`).
          releaseBody: "What's new: https://github.com/KingCreeper531/modpack-doctor/releases/tag/${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }} ${{ steps.winsign.outputs.args }}

  # Each build job merges its platforms into latest.json. This job checks that none was lost and
  # every entry is signed, and points the download URLs at github.com release downloads
  # (tauri-action writes api.github.com asset URLs; CONTRACTS.md invariant 18 allows only
  # github.com and its download redirect). Signatures cover the file bytes, not the URL.
  finalize:
    name: finalize latest.json
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download latest.json and the asset list
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .id')"
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json was not uploaded to the draft release."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > latest.json
          echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"

      - name: Check every platform and rewrite the download URLs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.parse

          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          names = {str(a["id"]): a["name"] for a in json.load(open("assets.json"))}
          latest = json.load(open("latest.json"))
          errors = []
          if "v" + latest.get("version", "") != tag:
              errors.append(f"latest.json announces version {latest.get('version')}, not {tag}.")
          api = re.compile(r"^https://api\.github\.com/repos/[^/]+/[^/]+/releases/assets/(\d+)$")
          for platform, entry in latest.get("platforms", {}).items():
              m = api.match(entry.get("url", ""))
              if m and m.group(1) in names:
                  entry["url"] = base + urllib.parse.quote(names[m.group(1)])
          for platform in ["windows-x86_64", "darwin-x86_64", "darwin-aarch64", "linux-x86_64"]:
              entry = latest.get("platforms", {}).get(platform)
              if not entry or not entry.get("signature"):
                  errors.append(f"latest.json has no signed {platform} entry. Re-run the failed build job.")
          for platform, entry in latest.get("platforms", {}).items():
              if not entry.get("url", "").startswith(base):
                  errors.append(f"latest.json's {platform} URL is not a release download of {tag}: {entry.get('url')}")
          json.dump(latest, open("latest.json", "w"), indent=2)
          print(json.dumps({**latest, "platforms": {k: v["url"] for k, v in latest["platforms"].items()}}, indent=2))
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      - name: Replace latest.json on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          ASSET_ID: ${{ steps.fetch.outputs.asset_id }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null
          echo "latest.json is final. Check the draft release, then publish it."
